<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brian Bergen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2530;
    --stone:#e7eaef;
    --stone-dim:#93a0b2;
    --accent:#7b93b0;
    --line: rgba(231,234,239,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--stone);
    font-family:'Inter', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 4.5rem 1.5rem 5rem;
    text-align:center;
  }
  h1{
    font-family:'Libre Franklin', sans-serif;
    font-weight:700;
    font-size:clamp(2rem, 5vw, 2.6rem);
    margin:0 0 2.5rem;
    color:var(--stone);
    letter-spacing:-0.01em;
  }
  .photos{
    display:flex;
    gap:1.2rem;
    justify-content:center;
    align-items:flex-end;
    width:100%;
    max-width:820px;
  }
  .photos img{
    border-radius:4px;
    display:block;
  }
  .photos .landscape{
    width:520px;
    max-width:60%;
  }
  .photos .portrait{
    width:280px;
    max-width:36%;
  }
  .links{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:0.8rem;
    margin-top:2.2rem;
  }
  .links .label{
    font-family:'Libre Franklin', sans-serif;
    font-weight:600;
    color:var(--stone-dim);
    font-size:0.76rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-right:0.3rem;
  }
  .links a{
    color:var(--accent);
    text-decoration:none;
    font-size:0.82rem;
    letter-spacing:0.04em;
    font-weight:500;
    border:1px solid var(--accent);
    border-radius:3px;
    padding:0.5rem 1.1rem;
    transition:background 0.2s, color 0.2s;
  }
  .links a:hover{
    background:var(--accent);
    color:var(--ink);
  }
  @media (max-width: 640px){
    .photos{ flex-wrap:wrap; }
    .photos .landscape, .photos .portrait{ max-width:85%; width:340px; }
  }
</style>
</head>
<body>
  <h1>Brian Bergen</h1>
  <div class="photos">
    <img class="landscape" src="brianandmegan.jpeg" alt="Brian and Megan">
    <img class="portrait" src="bearcounter.jpeg" alt="Bear">
  </div>
  <div class="links">
    <span class="label">Links:</span>
    <a href="https://www.linkedin.com/in/brianmbergen" target="_blank" rel="noopener">LinkedIn Profile</a>
    <a href="travel/croatia-2026/">Croatia</a>
    <a href="bear/">Bear</a>
  </div>
</body>
</html>
