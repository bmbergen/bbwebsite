<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2530;
    --panel:#242f3d;
    --stone:#e7eaef;
    --stone-dim:#93a0b2;
    --accent:#7b93b0;
    --line: rgba(231,234,239,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--stone);
    font-family:'Inter', sans-serif;
  }
  header{
    padding: 3.5rem 6vw 2rem;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'Libre Franklin', sans-serif;
    font-weight:600;
    font-size:0.75rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:0.6rem;
  }
  h1{
    font-family:'Libre Franklin', sans-serif;
    font-weight:700;
    font-size:clamp(2rem, 5vw, 3rem);
    margin:0;
    color:var(--stone);
    letter-spacing:-0.01em;
  }
  main{
    padding: 2rem 6vw 5rem;
  }
  .gallery{
    columns: 4 220px;
    column-gap: 10px;
  }
  .gallery img{
    width:100%;
    height:auto;
    display:block;
    border-radius:3px;
    cursor:zoom-in;
    margin-bottom:10px;
    break-inside:avoid;
  }
  @media (max-width: 820px){
    .gallery{columns: 2 160px;}
  }
  .lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(10,14,19,0.95);
    display:none;
    align-items:center; justify-content:center;
    padding:4vw;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:92vw; max-height:88vh; border-radius:3px;}
  .lightbox-close{
    position:absolute; top:2vw; right:3vw;
    color:var(--stone); font-size:2rem; cursor:pointer;
    font-family:'Libre Franklin',sans-serif;
  }
</style>
</head>

<header>
  <div class="eyebrow">Good Boy</div>

  <div class="gallery" id="gallery"></div>

  });

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  document.addEventListener('click', e => {
    if(e.target.tagName === 'IMG' && e.target.closest('.gallery')){
      lightboxImg.src = e.target.src;
      lightbox.classList.add('open');
    }
  });
  document.getElementById('lightboxClose').onclick = () => lightbox.classList.remove('open');
